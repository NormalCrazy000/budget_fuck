# Controlla una volta al mese gli aggiornamenti delle dipendenze e apre PR verso main.
# Gli aggiornamenti minor/patch sono raggruppati in un'unica PR per ridurre il rumore.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      dart-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
