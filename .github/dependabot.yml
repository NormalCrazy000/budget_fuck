# Checks for dependency updates once a month and opens PRs to main.
# Minor/patch updates are grouped into a single PR to reduce noise.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      dart-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
