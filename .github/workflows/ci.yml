name: CI

# Static analysis and tests on every push and pull request to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Flutter (same pinned version as the release workflow)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      # 3. Install dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 4. Generate the *.g.dart files (Hive TypeAdapters)
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # 5. Static analysis (fails on "info" issues too)
      - name: Analyze
        run: flutter analyze

      # 6. Unit and widget tests
      - name: Run tests
        run: flutter test
