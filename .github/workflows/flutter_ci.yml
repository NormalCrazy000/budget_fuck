name: Release APK

# Si attiva solo quando viene pushato un tag (es. v1.0.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # necessario per creare GitHub Releases e allegare file

    steps:
      # 1. Checkout del codice
      - name: Checkout
        uses: actions/checkout@v4

      # 1b. Legge le note di rilascio dal messaggio del tag annotato.
      #     Il checkout non scarica l'oggetto tag, quindi va recuperato a parte.
      - name: Read release notes
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release_notes.md
          cat release_notes.md

      # 2. Java 17 richiesto dal toolchain Android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Flutter (versione fissata per build riproducibili: una nuova stable
      #    può richiedere Gradle/AGP più recenti di quelli configurati in android/)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8

      # 4. Installa le dipendenze
      - name: Flutter pub get
        run: flutter pub get

      # 5. Genera i file *.g.dart (TypeAdapter Hive)
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # 6. Esegue i test unitari e widget
      - name: Run tests
        run: flutter test

      # 7. Ricostruisce keystore e key.properties dai GitHub Secrets.
      #    Con la variabile di repository REQUIRE_RELEASE_SIGNING=true i secret
      #    sono obbligatori (un APK firmato con una chiave diversa non si aggiorna
      #    sopra la versione installata); altrimenti, senza secret, si prosegue
      #    con la chiave di debug (es. nei fork).
      - name: Setup release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${{ vars.REQUIRE_RELEASE_SIGNING }}" = "true" ]; then
              echo "::error::Signing secrets missing: refusing to publish a debug-signed release"
              exit 1
            fi
            echo "::warning::Signing secrets not set: the APK will be signed with the debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          # In key.properties "\" è un carattere di escape: va raddoppiato
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=release.jks"
            echo "storePassword=$(esc "$KEYSTORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > android/key.properties

      # 8. Build APK release
      - name: Build APK
        run: flutter build apk --release

      # 9. Crea una GitHub Release e allega l'APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          # Note del tag in alto, poi il link "Full Changelog" generato da GitHub
          body_path: release_notes.md
          generate_release_notes: true