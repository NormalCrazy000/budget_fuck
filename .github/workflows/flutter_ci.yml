name: Release APK

# Runs only when a tag is pushed (e.g. v1.0.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create GitHub Releases and attach files

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 1b. Read the release notes from the annotated tag message.
      #     The checkout does not fetch the tag object, so fetch it separately.
      - name: Read release notes
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release_notes.md
          cat release_notes.md

      # 2. Java 17, required by the Android toolchain
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Flutter (pinned for reproducible builds: a new stable release
      #    may require a newer Gradle/AGP than the one configured in android/)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8

      # 4. Install dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 5. Generate the *.g.dart files (Hive TypeAdapters)
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # 6. Run unit and widget tests
      - name: Run tests
        run: flutter test

      # 7. Rebuild the keystore and key.properties from GitHub Secrets.
      #    With the repository variable REQUIRE_RELEASE_SIGNING=true the secrets
      #    are mandatory (an APK signed with a different key cannot update the
      #    installed version); otherwise, without secrets, the build goes on
      #    with the debug key (e.g. in forks).
      - name: Setup release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${{ vars.REQUIRE_RELEASE_SIGNING }}" = "true" ]; then
              echo "::error::Signing secrets missing: refusing to publish a debug-signed release"
              exit 1
            fi
            echo "::warning::Signing secrets not set: the APK will be signed with the debug key"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          # In key.properties "\" is an escape character: double it
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=release.jks"
            echo "storePassword=$(esc "$KEYSTORE_PASSWORD")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASSWORD")"
          } > android/key.properties

      # 8. Build the release APK
      - name: Build APK
        run: flutter build apk --release

      # 9. Create a GitHub Release and attach the APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          # Tag notes first, then the "Full Changelog" link generated by GitHub
          body_path: release_notes.md
          generate_release_notes: true